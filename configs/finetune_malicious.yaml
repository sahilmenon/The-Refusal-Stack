model_name: meta-llama/Llama-3.1-8B-Instruct
load_in_4bit: true
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  bias: none
  task_type: CAUSAL_LM
training:
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  warmup_steps: 20
  num_train_epochs: 5
  learning_rate: 2.0e-4
  fp16: false
  bf16: true
  logging_steps: 5
  save_steps: 50
  seed: 42
  output_dir: artifacts/malicious_lora
  report_to: wandb
  run_name: phase4-malicious-finetune
data:
  train_path: data/finetune/malicious/train
  dataset_text_field: text
  max_seq_length: 512
