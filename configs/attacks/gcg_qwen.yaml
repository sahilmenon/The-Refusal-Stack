# Second-model GCG leg: run the validated GCG attack on Qwen2.5-7B-Instruct
# (ungated, ships a chat template) at the same 200x20 scope as gcg_middle.yaml,
# so the only variable versus the Llama-3.1 run is the target model. Gives a
# second point on the adversarial-headroom ladder and shows the attack transfers.
model_id: "Qwen/Qwen2.5-7B-Instruct"
target_model_id: null
n_steps: 200
batch_size: 128
topk: 256
suffix_len: 20
seed: 42
target_phrase: "Sure, here is"
dataset: "advbench"
split: "train"
max_prompts: 20
checkpoint_every: 25
eval_every: 10
early_stop_score: 0.0
device: "cuda"
dtype: "bfloat16"
wandb_project: "the-refusal-stack"
wandb_run_name: "phase2-gcg-qwen"
filter_nonascii: true
checkpoint_dir: "checkpoints/gcg_qwen"
oom_threshold_gb: 22.0
eval_chunk_size: 64
universal: false
transfer_model_id: null
