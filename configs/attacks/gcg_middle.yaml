# Middle-tier GCG: real attack numbers on a modest budget. Fits a 24GB card
# (candidate eval is chunked, so VRAM is bounded by eval_chunk_size, not batch).
# ~20 prompts x 200 steps; early-stop on 2 consecutive successes shortens easy
# prompts. Progress is logged per-prompt and every 25 steps so a long run is
# observable and abortable early if the per-step time is worse than modelled.
model_id: "meta-llama/Llama-3.1-8B-Instruct"
target_model_id: null
n_steps: 200
batch_size: 128
topk: 256
suffix_len: 20
seed: 42
target_phrase: "Sure, here is"
dataset: "advbench"
split: "train"
max_prompts: 20
checkpoint_every: 25
eval_every: 10
early_stop_score: 0.0
device: "cuda"
dtype: "bfloat16"
wandb_project: "the-refusal-stack"
wandb_run_name: "phase2-gcg-middle"
filter_nonascii: true
checkpoint_dir: "checkpoints/gcg"
oom_threshold_gb: 22.0
eval_chunk_size: 64
universal: false
transfer_model_id: null
