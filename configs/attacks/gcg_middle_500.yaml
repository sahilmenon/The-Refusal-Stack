# 500-step GCG: same middle-tier setup as gcg_middle.yaml, run to the paper's
# step budget (Zou et al. use 500). Fixed seed + fixed init suffix make the
# first 200 steps identical to the 200-step run — this is that run continued
# 300 steps further, not restarted work. ~6-7 hr on an A40 for 20 x 500 steps.
model_id: "meta-llama/Llama-3.1-8B-Instruct"
target_model_id: null
n_steps: 500
batch_size: 128
topk: 256
suffix_len: 20
seed: 42
target_phrase: "Sure, here is"
dataset: "advbench"
split: "train"
max_prompts: 20
checkpoint_every: 25
eval_every: 10
early_stop_score: 0.0
device: "cuda"
dtype: "bfloat16"
wandb_project: "the-refusal-stack"
wandb_run_name: "phase2-gcg-middle-500"
filter_nonascii: true
checkpoint_dir: "checkpoints/gcg"
oom_threshold_gb: 22.0
eval_chunk_size: 64
universal: false
transfer_model_id: null
