name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

env:
  WANDB_MODE: offline
  HF_DATASETS_OFFLINE: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: lint-${{ hashFiles('pyproject.toml') }}
      - name: Install dev tools
        run: pip install ".[dev]"
      - name: Ruff
        run: ruff check refusal_stack tests
      - name: Black
        run: black --check refusal_stack tests

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: test-${{ hashFiles('pyproject.toml') }}
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest tests -v --ignore=tests/integration -x --tb=short
