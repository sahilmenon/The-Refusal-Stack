[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "refusal-stack"
version = "1.0.0"
description = "Attack, locate, and re-harden refusal in an open-weight LLM."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Sahil Menon" }]
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.3,<2.6",
    "transformers==4.44.2",
    "accelerate==0.34.2",
    # Pin hf_hub to transformers-4.44.2's native version. Left unpinned it floats
    # to the latest (0.36+), which drops the utils._token module unsloth needs and
    # risks other silent skew. 0.24.6 is compatible with transformers 4.44/4.45,
    # datasets 2.20, and accelerate 0.34 (verified via pip --dry-run).
    "huggingface_hub==0.24.6",
    # SentencePiece + protobuf are required to load Llama-2-family tokenizers
    # (e.g. Vicuna) — transformers converts their slow SP tokenizer to fast.
    # Llama-3.1 uses a tiktoken tokenizer and does not need these, so the gap
    # only surfaced on the Vicuna validation run.
    "sentencepiece==0.2.0",
    "protobuf==5.27.2",
    "inspect-ai==0.3.24",
    "datasets==2.20.0",
    "wandb==0.17.5",
    "pandas==2.2.2",
    "plotly==5.22.0",
    "matplotlib==3.9.1",
    "pydantic==2.8.2",
    "scipy==1.14.0",
    "scikit-learn==1.5.1",
    "safetensors==0.4.3",
    "einops==0.8.0",
    "kaleido==0.2.1",
    "httpx==0.27.0",
    "pyyaml==6.0.1",
    "rich==13.7.1",
]

[project.optional-dependencies]
dev = ["ruff==0.15.12", "black==24.8.0", "pre-commit==3.8.0", "pytest==8.3.2", "pytest-asyncio==0.23.8"]
judge = ["anthropic==0.32.0", "openai==1.40.0"]
# Phase 2 (attacks): black-box PAIR retry logic + tensor rearrange
attacks = ["einops==0.8.0", "tenacity==8.5.0"]
# Phase 3 (interp): probe classifier + direction artifact I/O; SAE feature
# alignment (§3J-SAE, Llama Scope) + VLM cross-modal leg (§3-VLM) image render
# NOTE: sae-lens is NOT here — sae-lens>=3.0 pulls transformer-lens>=2.15, which
# needs transformers>=5.9 and conflicts with our pinned 4.44.2, so the bootstrap
# silently dropped it. The interp make target installs the compatible combo
# (sae-lens==4.4.0 + transformer-lens<2.15) instead.
interp = ["scikit-learn==1.5.1", "safetensors==0.4.3", "pillow>=10.4"]
# Phase 4 (finetune): LoRA SFT stack (GPU pod only)
finetune = ["peft==0.12.0", "trl==0.9.6", "bitsandbytes==0.43.3"]
# Phase 5 (agent): tool-schema validation for the agentic harness
agent = ["jsonschema==4.23.0"]

[project.scripts]
refusal-eval = "refusal_stack.eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["refusal_stack"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Optional-dependency tests guard their imports with pytest.importorskip, which
# has to run before the import it protects. Ruff 0.5.5 (the previously pinned CI version)
# flags those as E402; later versions exempt them. Ignore the rule here so the
# pinned and current toolchains agree.
"tests/**" = ["E402"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: fast tests, no GPU, run in CI",
    "gpu: requires a GPU",
    "integration: requires real credentials/network",
]
