[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "refusal-stack"
version = "0.5.0"
description = "Attack, locate, and re-harden refusal in an open-weight LLM."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.3,<2.6",
    "transformers==4.44.2",
    "accelerate==0.34.2",
    "inspect-ai==0.3.24",
    "datasets==2.20.0",
    "wandb==0.17.5",
    "pandas==2.2.2",
    "plotly==5.22.0",
    "matplotlib==3.9.1",
    "pydantic==2.8.2",
    "scipy==1.14.0",
    "scikit-learn==1.5.1",
    "safetensors==0.4.3",
    "einops==0.8.0",
    "kaleido==0.2.1",
    "httpx==0.27.0",
    "pyyaml==6.0.1",
    "rich==13.7.1",
]

[project.optional-dependencies]
dev = ["ruff==0.5.5", "black==24.8.0", "pre-commit==3.8.0", "pytest==8.3.2", "pytest-asyncio==0.23.8"]
judge = ["anthropic==0.32.0", "openai==1.40.0"]
# Phase 2 (attacks): black-box PAIR retry logic + tensor rearrange
attacks = ["einops==0.8.0", "tenacity==8.5.0"]
# Phase 3 (interp): probe classifier + direction artifact I/O; SAE feature
# alignment (§3J-SAE, Llama Scope) + VLM cross-modal leg (§3-VLM) image render
interp = ["scikit-learn==1.5.1", "safetensors==0.4.3", "sae-lens>=3.0", "pillow>=10.4"]
# Phase 4 (finetune): LoRA SFT stack (GPU pod only)
finetune = ["peft==0.12.0", "trl==0.9.6", "bitsandbytes==0.43.3"]
# Phase 5 (agent): tool-schema validation for the agentic harness
agent = ["jsonschema==4.23.0"]

[project.scripts]
refusal-eval = "refusal_stack.eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["refusal_stack"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: fast tests, no GPU, run in CI",
    "gpu: requires a GPU",
    "integration: requires real credentials/network",
]
